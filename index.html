<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1F4DC" />
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      try {
        if (localStorage.getItem("wellspace.theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="WellSpace — an anonymous wellbeing and habit-tracking space for students. Quiet, warm, and yours alone."
    />
    <title>WellSpace — a quiet space for your wellbeing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
